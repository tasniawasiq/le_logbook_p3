    </div>

<b id="userErrorTitle">Something needs your attention</b><p id="userErrorText"></p>

<script>
/* ===== Error log: catches problems so you can see and fix them ===== */
const APP_VERSION='prototype3-v4-test';
// Temporary owner trial: retain required labels, but permit missing photos.
const OWNER_TEST_MODE=true;
const photoTestNote=()=>OWNER_TEST_MODE?'<p class="test-note">Test mode: photo upload is optional for now. The required label applies to the final workflow.</p>':'';
let errs=[]; try{ const v=JSON.parse(localStorage.getItem('vmr-runlog-errors')||'[]'); if(Array.isArray(v)) errs=v.filter(x=>x&&typeof x.msg==='string'); }catch{}
function logError(kind,msg,detail,level){
  const tab=document.querySelector('nav [aria-selected="true"]');
  errs.push({at:new Date().toLocaleString(),kind,level:level||'error',msg:String(msg??'Unknown problem').slice(0,400),detail:String(detail??'').slice(0,2000),tab:tab?tab.textContent.trim():'',ver:APP_VERSION});
  errs=errs.slice(-50);
  try{ localStorage.setItem('vmr-runlog-errors',JSON.stringify(errs)); }catch{}
  updateErrBtn(); notifyUser(kind, String(msg||'Something went wrong. Try again or send the error details to the team.')); 
}

const FREE_MIN=120, RATE=75, WINDOW_MIN=14*60, PIN='1234', KEY='vmr-runlog-v2';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const toMin=t=>{ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
const fmt=m=>{ if(m==null) return '—'; m=Math.max(0,Math.round(m)); return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const dur=m=>{ m=Math.max(0,Math.round(m)); const h=Math.floor(m/60), mm=m%60; return h?`${h}h ${String(mm).padStart(2,'0')}m`:`${mm}m`; };
const money=n=>'$'+(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const t=String(v??'').trim();if(!/^\d+(?:\.\d+)?$/.test(t))return null;const n=Number(t);return Number.isFinite(n)?n:null;};
const newId=()=>Math.random().toString(36).slice(2,9);
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dstr(new Date());
const nowMin=()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const nice=ds=>new Date(ds+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

// Everything is saved on this phone until the database is connected
let db={drivers:[],days:[],stops:[],logs:[]};
let readBlocked=false, dirty=false;
try{
 const data=JSON.parse(localStorage.getItem(KEY)||'{}');
 if(!data || typeof data!=='object' || Array.isArray(data)) throw new Error('Invalid saved data');
 for(const key of ['drivers','days','stops','logs']) if(data[key]!==undefined && (!Array.isArray(data[key]) || data[key].some(x=>!x||typeof x!=='object'))) throw new Error('Invalid '+key+' data');
 db=Object.assign(db,data);
 db.stops.forEach(x=>{if(!Array.isArray(x.photos)) x.photos=[];});
}catch(e){readBlocked=true;logError('Saved data could not be opened','Existing records were left untouched. Do not clear browser data. Send the error details to the team.',e.message);}
function save(){
 try{
  if(readBlocked) throw new Error('Saved data could not be read; saving is blocked to protect existing records.');
  localStorage.setItem(KEY,JSON.stringify(db));
  dirty=false;document.getElementById('retrySave').hidden=true;
  return true;
 }catch(e){
  dirty=true;document.getElementById('retrySave').hidden=readBlocked;
  const t=document.getElementById('toast'); if(t)t.hidden=true;
  logError('Changes NOT saved',readBlocked?e.message:'This browser could not save your changes or photos. Keep this tab open. Free device space or allow browser storage, then tap Retry saving. Do not clear this site’s data.',e.message);
  return false;
 }
}
document.getElementById('retrySave').onclick=()=>{if(save()){document.getElementById('userError').hidden=true;renderAll();toast('Changes saved in this browser.');}};
function deliveryReady(s){return !!s.pod && Array.isArray(s.photos) && s.photos.some(p=>typeof p==='string'&&p.startsWith('data:image/'));}
function deliveryNeeds(s){
 const missing=[];
 if(!['tow','live'].includes(s.type)) missing.push('Choose Tow and hook or Live unload in Step 1.');
 if(!s.pod) missing.push('Tick “I got the signed delivery bill” in the Bill of delivery card.');
 if(!OWNER_TEST_MODE && !s.photos?.some(p=>typeof p==='string'&&p.startsWith('data:image/'))) missing.push('Upload a clear photo of the signed delivery bill.');
 return missing;
}
function updateCompletionHint(s, attempted=false){
 const hint=document.getElementById('completionHint'); if(!hint)return;
 const missing=deliveryNeeds(s);
 hint.textContent=missing.length ? (attempted?'Cannot complete yet. ':'Before completing: ')+missing.join(' ') : 'Ready to complete.'+(OWNER_TEST_MODE?' Photos are optional during testing.':'');
 hint.style.color=missing.length?'var(--bad)':'var(--ok)';
}
function finishDelivery(s){
 const missing=deliveryNeeds(s);
 if(missing.length){
  updateCompletionHint(s,true);
  notifyUser('Cannot complete delivery yet',missing.join(' '));
  return false;
 }
 const previous=s.depart;s.depart=fmt(nowMin());
 if(!save()){
  s.depart=previous;
  const hint=document.getElementById('completionHint');
  if(hint){hint.textContent='Delivery was not completed because saving failed. Check the error message above.';hint.style.color='var(--bad)';}
  return false;
 }
 document.getElementById('userError').hidden=true;
 return true;
}

// Same log types as prototype 1
const TYPES={
  diesel:{label:'Diesel',icon:'⛽',money:true,hint:'Fuel + receipt'},
  repair:{label:'Repair',icon:'🔧',money:true,hint:'Receipt + what was fixed'},
  delay:{label:'Delay',icon:'⏱️',money:false,hint:'Stuck waiting or traffic'},
  other:{label:'Other',icon:'🧾',money:true,hint:'Parking, tolls, other'}
};
const drv=id=>db.drivers.find(d=>d.id===id)||{name:'Unknown',truck:''};
function dwell(s){ if(!s.arrive) return null; const end=s.depart?toMin(s.depart):(s.date===today()?nowMin():toMin(s.arrive)); return Math.max(0,end-toMin(s.arrive)); }
function detention(s){ if(s.type!=='live') return 0; const w=dwell(s); return w==null?0:Math.max(0,w-FREE_MIN); }
function dayMiles(day){ if(!day||day.odoStart==null) return 0; const odos=[day.odoEnd,...db.logs.filter(l=>l.driverId===day.driverId&&l.date===day.date).map(l=>l.odo)].filter(v=>v!=null); return odos.length?Math.max(0,Math.max(...odos)-day.odoStart):0; }
function stopState(s){
  if(s.depart) return detention(s)>0?{cls:'warn',text:'✅ Done (extra pay)'}:{cls:'ok',text:'✅ Done'};
  if(s.type==='live') return detention(s)>0?{cls:'bad',text:'🔴 Waiting too long'}:{cls:'warn',text:'⏳ Being unloaded'};
  return {cls:'warn',text:'📍 At this stop'};
}
function readPhoto(file){ return new Promise((ok,bad)=>{
 if(!file || !file.type.startsWith('image/')) {bad(new Error('Choose an image file, such as JPEG or PNG.'));return;}
 const img=new Image(), url=URL.createObjectURL(file);
 const timer=setTimeout(()=>{URL.revokeObjectURL(url);bad(new Error('Photo loading timed out. Try a smaller JPEG or PNG.'));},20000);
 img.onload=()=>{try{
  const k=Math.min(1,2000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
  const ctx=c.getContext('2d');if(!ctx)throw new Error('Photo processing is unavailable.');
  ctx.drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.9));
 }catch(e){bad(e);}finally{clearTimeout(timer);URL.revokeObjectURL(url);}};
 img.onerror=()=>{clearTimeout(timer);URL.revokeObjectURL(url);bad(new Error('This photo could not be opened. Try a JPEG or PNG.'));};img.src=url;
}); }
const thumbs=list=>list&&list.length?`<div class="thumbs">${list.map(u=>`<img src="${u}" alt="Photo, tap to make bigger" data-big>`).join('')}</div>`:'';
const photoBtn=(id,label,count)=>`<label class="photobtn">📷 ${count?'Add another photo':label}<input type="file" id="${id}" accept="image/*"></label>`;

const driverDrafts=new Map();
function getDriverDraft(driver,date){
 const key=driver+':'+date;
 if(!driverDrafts.has(key))driverDrafts.set(key,{odo0:'',odo1:'',pics:{odo0:[],odo1:[]}});
 return driverDrafts.get(key);
}
function endDriverDay(day,reading,photo){
 if(db.stops.some(s=>s.driverId===day.driverId&&s.date===day.date&&!s.depart)){
  notifyUser('Finish the current stop first','Complete your current delivery, then use End my day after all driving is finished.');return false;
 }
 if(reading==null || !Number.isSafeInteger(reading) || reading<day.odoStart){
  notifyUser('Check the final odometer','Enter a whole odometer number at least as high as the start-of-day reading.');return false;
 }
 if(!OWNER_TEST_MODE&&!photo){notifyUser('Odometer photo required','Add your final odometer photo before ending the day.');return false;}
 const previous={...day};
 Object.assign(day,{odoEnd:reading,endPhoto:photo||null,end:fmt(nowMin()),endedAt:Date.now()});
 if(!save()){Object.keys(day).forEach(k=>delete day[k]);Object.assign(day,previous);return false;}
 return true;
}

function logRow(l,showDriver){ const T=TYPES[l.type], pics=[...(l.photos?.receipt||[]),...(l.photos?.odometer||[])];
  const sub=[showDriver?nice(l.date):'', l.at, l.gal?l.gal+' gal':'', l.odo!=null?l.odo.toLocaleString()+' mi':'', l.type==='delay'&&l.from&&l.to?`${l.from}–${l.to} (${dur(toMin(l.to)-toMin(l.from))})`:'', l.where, l.note, l.personal?'Personal':''].filter(Boolean).map(esc).join(' · ');
  return `<div class="logrow"><span class="ic">${T.icon}</span><div class="mid"><b>${showDriver?esc(drv(l.driverId).name)+': ':''}${T.label}</b><span>${sub}</span>${showDriver?thumbs(pics.slice(0,3)):(pics.length?`<span> · 📷 ${pics.length}</span>`:'')}</div>${T.money?`<span class="amt">${money(l.amt)}</span>`:''}</div>`; }

// adds a photo to a slot without redrawing the page (keeps typed numbers); max = how many photos allowed
function wireSlot(key,id,list,max){ const el=$('#'+id); if(!el) return; el.onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
  try{ const u=await readPhoto(f); if(max===1) list.length=0; list.push(u);
    $('#slot-'+key).innerHTML=(max===1?`<label class="photobtn">📷 Retake photo<input type="file" id="${id}" accept="image/*"></label>`:photoBtn(id,'',list.length))+thumbs(list);
    wireSlot(key,id,list,max); toast('📷 Photo added'); }catch(e){ logError('Photo not added',e?.message||'That photo could not be opened. Try JPEG or PNG.',e?.stack); } }; }

/* ---------- log form (pop-up) ---------- */
function openSheet(title,html){ $('#shTitle').textContent=title; $('#shBody').innerHTML=html; $('#sheetbg').hidden=false; }
function closeSheet(){ $('#sheetbg').hidden=true; $('#shBody').innerHTML=''; }
function openForm(type){
  const T=TYPES[type], now=nowMin(), staged={receipt:[],odometer:[]};
  let b='';
  if(T.money) b+=`<div class="field"><label for="fAmt">Total paid ($)</label><input id="fAmt" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>`;
  if(type==='diesel') b+=`<div class="row"><div class="field"><label for="fGal">Gallons</label><input id="fGal" type="number" inputmode="decimal" step="0.1"></div><div class="field"><label for="fOdo">Odometer (miles)</label><input id="fOdo" type="number" inputmode="numeric"></div></div>`;
  if(T.money) b+=`<div class="field" style="margin-bottom:0"><label>📄 Receipt (bill of payment)</label><span class="hint">Take a picture or upload one from your phone</span></div><div id="slot-receipt">${photoBtn('pReceipt','Take or upload receipt',0)}</div>`;
  if(type==='diesel') b+=`<div class="field" style="margin-bottom:0"><label>📷 Photo of the odometer <span class="hint">(required)</span></label></div><div id="slot-odometer">${photoBtn('pOdometer','Take or upload photo',0)}</div>${photoTestNote()}`;
  if(type==='delay') b+=`<div class="row"><div class="field"><label for="fFrom">Started</label><input id="fFrom" type="time" value="${fmt(now-60)}"></div><div class="field"><label for="fTo">Ended</label><input id="fTo" type="time" value="${fmt(now)}"></div></div>`;
  b+=`<div class="field"><label for="fWhere">Where</label><input id="fWhere" type="text" placeholder="Station, warehouse or gate"></div>`;
  b+=`<div class="field"><label for="fNote">${type==='repair'?'What was fixed':type==='other'?'What was it for':'Note (optional)'}</label><input id="fNote" type="text" placeholder="${type==='repair'?'Example: air line fitting':type==='other'?'Example: parking, tolls':''}"></div>`;
  if(T.money) b+=`<label class="check"><input type="checkbox" id="fPersonal"> <span>Personal expense <span class="hint">(not counted in business totals)</span></span></label>`;
  b+=`<button class="btn primary" id="fSave" style="width:100%;margin-top:8px">Save ${T.label.toLowerCase()}</button>`;
  openSheet(`${T.icon} ${T.label}`,b);
  const wire=(key,id)=>{ const el=$('#'+id); if(!el) return; el.onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ staged[key].push(await readPhoto(f)); $('#slot-'+key).innerHTML=photoBtn(id,'',staged[key].length)+thumbs(staged[key]); wire(key,id); toast('📷 Photo added'); }catch(e){ logError('Photo not added',e?.message||'That photo could not be opened.',e?.stack); } }; };
  wire('receipt','pReceipt'); wire('odometer','pOdometer');
  $('#fSave').onclick=()=>{
    const amt=T.money?num($('#fAmt').value):null;
    if(T.money&&!(amt>0)){ toast('Type how much you paid.'); return; }
    if(type==='repair'&&!$('#fNote').value.trim()){ toast('Say what was fixed.'); return; }
    if(type==='diesel'&&num($('#fOdo').value)==null){ toast('Type the odometer number.'); return; }
    if(type==='diesel'&&!OWNER_TEST_MODE&&!staged.odometer.length){ toast('Take a photo of the odometer.'); return; }
    db.logs.push({id:newId(),driverId:me,date:today(),type,at:fmt(now),amt,gal:type==='diesel'?num($('#fGal').value):null,odo:type==='diesel'?num($('#fOdo').value):null,
      from:type==='delay'?$('#fFrom').value:null,to:type==='delay'?$('#fTo').value:null,
      where:$('#fWhere').value.trim(),note:$('#fNote').value.trim(),personal:!!(T.money&&$('#fPersonal').checked),photos:staged});
    if(!save()){db.logs.pop();return;} closeSheet(); toast(`${T.label} saved`); renderAll();
  };
}

/* ================= OWNER: analytics, view + export only ================= */
let unlocked=false, period='today', who='all';
function inPeriod(ds){
  const t=new Date(), d=new Date(ds+'T12:00');
  if(period==='today') return ds===today();
  if(period==='week'){ const mon=new Date(t); mon.setHours(0,0,0,0); mon.setDate(t.getDate()-((t.getDay()+6)%7)); return d>=mon; }
  if(period==='month') return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth();
  return true;
}
function pick(){ const ok=x=>inPeriod(x.date)&&(who==='all'||x.driverId===who);
  return {days:db.days.filter(ok),stops:db.stops.filter(ok),logs:db.logs.filter(ok)}; }
function sums(P){
  const exp={diesel:0,repair:0,other:0}; P.logs.forEach(l=>{ if(TYPES[l.type].money&&!l.personal) exp[l.type]+=l.amt||0; });
  const bills=P.stops.reduce((a,s)=>a+(s.billAmt||0),0), wait=P.stops.reduce((a,s)=>a+detention(s),0)/60*RATE;
  const expTot=exp.diesel+exp.repair+exp.other, rev=bills+wait;
  return {exp,expTot,bills,wait,rev,miles:P.days.reduce((a,d)=>a+dayMiles(d),0),billCount:P.stops.filter(s=>s.billAmt!=null).length,gal:P.logs.reduce((a,l)=>a+(l.gal||0),0)};
}
function renderOwner(){
  const el=$('#view-owner');
  if(!unlocked){
    el.innerHTML=`<div class="panel lock"><div class="ic">🔒</div><h2>Analytics</h2><p class="note" style="margin:0 0 14px">Enter the PIN to view revenue, expenses and delivery reports.</p>
      <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" style="text-align:center;font-size:22px;letter-spacing:.3em">
      <button class="btn primary" id="unlock" style="width:100%;margin-top:12px">Open</button></div>`;
    const go=()=>{ if($('#pin').value===PIN){ unlocked=true; renderOwner(); } else { toast('Wrong PIN. Try again.'); $('#pin').value=''; } };
    $('#unlock').onclick=go; $('#pin').onkeydown=e=>{ if(e.key==='Enter') go(); };
    return;
  }
  const P=pick(), S=sums(P), label={today:'today',week:'this week',month:'this month',all:'all time'}[period];
  let h=`<div class="toprow"><p class="help" style="flex:1;margin:0">Hi Violetta 👋 Your business at a glance. This prototype shows records saved in this browser. Shared driver syncing is not connected.</p><button class="btn" id="lock">🔒 Lock</button></div>
  <div class="filters"><div class="period" role="group" aria-label="Time period">${[['today','Today'],['week','This week'],['month','This month'],['all','All']].map(([k,v])=>`<button data-p="${k}" aria-pressed="${period===k}">${v}</button>`).join('')}</div>
    <select id="who" aria-label="Driver"><option value="all">All drivers</option>${db.drivers.map(d=>`<option value="${d.id}" ${who===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
    <button class="btn mini" id="export" style="margin-left:auto">⬇️ Export to Excel</button></div>
  <div class="kpis">
    <div class="kpi"><div class="label">Miles driven</div><div class="v num">${S.miles.toLocaleString()}</div><div class="s">${label}</div></div>
    <div class="kpi"><div class="label">Expenses</div><div class="v num">${money(S.expTot)}</div><div class="s">${S.gal?Math.round(S.gal*10)/10+' gal diesel':'business only'}</div></div>
    <div class="kpi"><div class="label">Projected revenue</div><div class="v num">${money(S.rev)}</div><div class="s">${S.billCount} delivery bill${S.billCount===1?'':'s'}${S.wait?' + '+money(S.wait)+' wait pay':''}</div></div>
    <div class="kpi"><div class="label">Estimated profit</div><div class="v num" style="color:${S.rev-S.expTot<0?'var(--bad)':'inherit'}">${money(S.rev-S.expTot)}</div><div class="s">revenue minus expenses</div></div>
  </div>`;
  // charts
  const dates=[...new Set([...P.stops,...P.logs,...P.days].map(x=>x.date))].sort();
  const perDay=dates.map(ds=>{ const Q={days:P.days.filter(x=>x.date===ds),stops:P.stops.filter(x=>x.date===ds),logs:P.logs.filter(x=>x.date===ds)}; return {ds,...sums(Q)}; });
  const maxV=Math.max(1,...perDay.map(d=>Math.max(d.rev,d.expTot)));
  const maxE=Math.max(1,S.exp.diesel,S.exp.repair,S.exp.other);
  h+=`<div class="grid2"><div class="panel"><h2>Money by day</h2>${perDay.length?`<div class="vbars">${perDay.map(d=>`<div class="vb" title="${nice(d.ds)}: revenue ${money(d.rev)}, expenses ${money(d.expTot)}"><div class="pair"><i style="height:${d.rev/maxV*100}%;background:var(--accent)"></i><i style="height:${d.expTot/maxV*100}%;background:var(--warn)"></i></div><span>${nice(d.ds).split(',')[0]}</span></div>`).join('')}</div>
      <div class="key"><span><i style="background:var(--accent)"></i>Revenue</span><span><i style="background:var(--warn)"></i>Expenses</span></div>`:'<p class="note">No data yet for this time.</p>'}</div>
    <div class="panel"><h2>Where the money went</h2><div class="hbars">${['diesel','repair','other'].map(k=>`<div class="hb"><span>${TYPES[k].icon} ${TYPES[k].label}</span><div class="track"><i style="width:${S.exp[k]/maxE*100}%;background:var(--warn)"></i></div><span class="num" style="text-align:right">${money(S.exp[k])}</span></div>`).join('')}</div>
      <p class="note">Personal expenses are left out.</p></div></div>`;
  // by driver
  if(who==='all'&&db.drivers.length){
    h+=`<h2 class="sect">👥 By driver</h2><div class="panel" style="padding:0"><div class="tablewrap"><table><thead><tr><th>Driver</th><th class="r">Days</th><th class="r">Miles</th><th class="r">Stops</th><th class="r">Expenses</th><th class="r">Revenue</th><th class="r">Profit</th></tr></thead><tbody>
      ${db.drivers.map(d=>{ const Q={days:P.days.filter(x=>x.driverId===d.id),stops:P.stops.filter(x=>x.driverId===d.id),logs:P.logs.filter(x=>x.driverId===d.id)}, T=sums(Q);
        return `<tr><td>${esc(d.name)}<br><span style="color:var(--muted);font-size:13px">${esc(d.truck)}</span></td><td class="num r">${Q.days.length}</td><td class="num r">${T.miles.toLocaleString()}</td><td class="num r">${Q.stops.filter(s=>s.depart).length}</td><td class="num r">${money(T.expTot)}</td><td class="num r">${money(T.rev)}</td><td class="num r">${money(T.rev-T.expTot)}</td></tr>`; }).join('')}
      </tbody></table></div></div>`;
  }
  // today's runs
  const t=today(), todays=db.drivers.filter(d=>who==='all'||d.id===who);
  h+=`<h2 class="sect">🚚 Today's runs</h2><div class="runs">${todays.length?todays.map(d=>{
    const day=db.days.find(x=>x.driverId===d.id&&x.date===t), st=db.stops.filter(x=>x.driverId===d.id&&x.date===t);
    const used=day?nowMin()-toMin(day.start):0, left=WINDOW_MIN-used;
    return `<article class="run"><div class="runhead"><div class="who">${esc(d.name)} · ${esc(d.truck)}<small>${day?`Started ${day.start} · Must stop driving by ${fmt(toMin(day.start)+WINDOW_MIN)} · ${dayMiles(day).toLocaleString()} mi${day.odoEnd!=null?' · day ended':''}`:'Has not started today'}</small>${day?thumbs([day.startPhoto,day.endPhoto].filter(Boolean)):''}</div>
      ${day?`<div class="hos"><div class="bar ${day.odoEnd!=null?'':left<=0?'bad':left<150?'warn':''}"><i style="width:${Math.min(100,used/WINDOW_MIN*100)}%"></i></div><span class="t num">${day.odoEnd!=null?'Done':left>0?dur(left)+' of driving left':'No driving time left'}</span></div>`:''}</div>
      ${st.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Stop</th><th>Got there</th><th>Left</th><th class="r">Waited</th><th class="r">Extra pay</th><th class="r">Bill</th><th>Paperwork</th><th>Status</th></tr></thead><tbody>
      ${st.map((s,k)=>{ const w=dwell(s), dd=detention(s), ss=stopState(s);
        return `<tr><td class="num">${k+1}</td><td>${esc(s.name)}${s.type?`<br><span style="color:var(--muted);font-size:13px">${s.type==='tow'?'Tow and hook':'Live unload'}</span>`:''}</td><td class="num">${s.arrive}</td><td class="num">${s.depart||'—'}</td><td class="num r">${w==null?'—':dur(w)}</td><td class="num r">${dd?money(dd/60*RATE):'—'}</td><td class="num r">${s.billAmt!=null?money(s.billAmt):'—'}</td>
        <td class="${s.depart&&(!s.seal||!deliveryReady(s))?'miss':''}">${!s.depart?'—':(s.seal&&deliveryReady(s)?'✅ All in':'⚠️ Missing '+[!s.seal&&'seal #',!s.pod&&'signed bill confirmation',!s.photos.length&&'bill photo'].filter(Boolean).join(' + '))}${s.photos.length?' · 📷 '+s.photos.length:''}</td><td><span class="pill ${ss.cls}">${ss.text}</span></td></tr>`; }).join('')}
      </tbody></table></div>`:'<p class="note" style="margin:0;padding:10px 14px">No stops yet today.</p>'}</article>`; }).join(''):'<p class="note">No drivers yet. Drivers add themselves on the 🚚 Driver tab.</p>'}</div>`;
  // bills + expenses
  const bills=P.stops.filter(s=>s.depart||s.photos.length||s.billAmt!=null).slice().reverse();
  h+=`<h2 class="sect">📄 Delivery bills · Thursday payment paperwork</h2><p class="note">Each photo belongs to the delivery shown beside it. Tap every page to check readability. Choose All to find older bills. Paperwork ready does not mean payment received.</p>`+(bills.length?bills.map(s=>`<div class="bill" style="grid-template-columns:auto minmax(0,1fr) auto">${s.photos.length?thumbs(s.photos):'<div class="nophoto">No photo</div>'}
      <div><b>${esc(s.name)}</b><br><strong>${deliveryReady(s)?'✅ Paperwork ready':'⚠️ Check signature confirmation / missing photo'}</strong><br><span class="note" style="margin:0">${esc(drv(s.driverId).name)} · ${nice(s.date)}${s.billNumber?' · Bill #'+esc(s.billNumber):''}${s.depart?' · left '+s.depart:''}${s.photos.length>1?' · '+s.photos.length+' photos':''}</span><label class="photobtn">📷 Add signed bill page<input type="file" accept="image/*" data-bill-upload="${esc(s.id)}"></label></div>
      <div class="num" style="font-weight:600;font-size:17px">${s.billAmt!=null?money(s.billAmt):'<span class="note">No amount</span>'}</div></div>`).join(''):'<p class="note">No delivery bills yet for this time.</p>');
  h+=`<h2 class="sect">🧾 Expenses and delays</h2>`+(P.logs.length?P.logs.slice().reverse().map(l=>logRow(l,true)).join(''):'<p class="note">Nothing logged for this time.</p>');
  h+=`<p class="note">Extra wait pay ("detention") counts on live unloads after ${FREE_MIN/60} free hours, at $${RATE}/hr. These are guesses until VMR gives us the real numbers.</p>`;
  el.innerHTML=h;
  $('#lock').onclick=()=>{ unlocked=false; renderOwner(); };
  $$('[data-p]').forEach(b=>b.onclick=()=>{ period=b.dataset.p; renderOwner(); });
  $('#who').onchange=e=>{ who=e.target.value; renderOwner(); };
  $('#export').onclick=exportCSV;
  $$('[data-bill-upload]').forEach(input=>input.onchange=async()=>{
    const file=input.files[0];if(!file)return;
    const stop=db.stops.find(s=>s.id===input.dataset.billUpload);if(!stop)return;
    input.disabled=true;
    try{const photo=await readPhoto(file);stop.photos.push(photo);
      if(!save())return;
      toast('Bill photo attached to '+stop.name);renderOwner();
    }catch(e){logError('Bill photo not added',e.message,e.stack);}
    finally{input.disabled=false;input.value='';}
  });
}
async function exportCSV(){
  const P=pick(), q=v=>{ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const rows=[['Date','Driver','Truck','Kind','Place','Details','Amount ($)','Gallons','Odometer','Arrived','Left','Waited (min)','Extra wait pay ($)','Seal #','Signed bill','Photos','Personal']];
  P.days.forEach(d=>{ const D=drv(d.driverId); rows.push([d.date,D.name,D.truck,'Day','', 'Miles driven: '+dayMiles(d),'', '',d.odoStart+(d.odoEnd!=null?' to '+d.odoEnd:''),d.start,'','','','','','','']); });
  P.stops.forEach(s=>{ const D=drv(s.driverId), dd=detention(s); rows.push([s.date,D.name,D.truck,'Delivery stop',s.name,[s.type==='tow'?'Tow and hook':s.type==='live'?'Live unload':'',s.billNumber?'Bill #'+s.billNumber:''].filter(Boolean).join(' · '),s.billAmt??'','','',s.arrive,s.depart||'',dwell(s)??'',dd?(dd/60*RATE).toFixed(2):'',s.seal,s.pod?'Yes':'No',s.photos.length,'']); });
  P.logs.forEach(l=>{ const D=drv(l.driverId); rows.push([l.date,D.name,D.truck,TYPES[l.type].label,l.where,[l.note,l.type==='delay'&&l.from?l.from+'–'+l.to:''].filter(Boolean).join(' · '),l.amt??'',l.gal??'',l.odo??'',l.at,'','','','','',(l.photos.receipt.length+l.photos.odometer.length),l.personal?'Yes':'No']); });
  const head=rows.shift(); rows.sort((a,b)=>String(a[0]+a[9]).localeCompare(String(b[0]+b[9]))); rows.unshift(head);
  const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'), name=`vmr-runlog-${period}-${today()}.csv`;
  if(rows.length===1){ toast('Nothing to export for this time.'); return; }
  try{ const dl=window.claude?.use?await window.claude.use('downloads'):null;
    if(dl){ await dl.save({filename:name,data:csv}); return; } }catch(e){ if(e&&e.code==='declined') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast('Exported. Open it with Excel or Google Sheets.');
}

/* ================= shared ================= */
function renderAll(){
  if(!save()) return;
  try{ renderDriver(); }catch(e){ logError('Driver screen',e.message,e.stack); $('#view-driver').innerHTML='<div class="panel"><b>⚠️ This screen hit a problem.</b><p class="note">Tap 🐞 Error log at the bottom and send it to the team.</p></div>'; }
  try{ renderOwner(); }catch(e){ logError('Analytics screen',e.message,e.stack); $('#view-owner').innerHTML='<div class="panel"><b>⚠️ This screen hit a problem.</b><p class="note">Tap 🐞 Error log at the bottom and send it to the team.</p></div>'; }
}
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2800); }
document.addEventListener('click',e=>{ const im=e.target.closest('img[data-big]'); if(im) openSheet('Delivery document / photo',`<p class="note">Check that all text and signatures are readable.</p><a class="btn" href="${im.src}" download="VMR-document.jpg">Download photo</a><img class="bigimg" src="${im.src}" alt="Document photo">`); });
$('#errBtn').onclick=openErrLog; $('#verNote').textContent='Version '+APP_VERSION; updateErrBtn();
$('#shClose').onclick=closeSheet; $('#sheetbg').onclick=e=>{ if(e.target.id==='sheetbg') closeSheet(); };
$$('nav button').forEach(b=>b.onclick=()=>{ $$('nav button').forEach(x=>x.setAttribute('aria-selected',x===b)); ['driver','owner'].forEach(v=>$('#view-'+v).hidden=v!==b.dataset.tab); });
// Keep error notices visible until dismissed.
// keep wait timers fresh, but never while someone is typing
setInterval(()=>{ if($('#sheetbg').hidden && !document.activeElement.matches('input,select,textarea')) renderAll(); },30000);
renderAll();
